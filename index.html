:root[data-theme="dark"]{

*,*::before,*::after{box-sizing:border-box}
html,body,#app{height:100%}

/* ---------- top bar (shared) ---------- */

/* ---------- bottom sheet ---------- */

<script>
'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const pad2=n=>String(n).padStart(2,'0');
const dayKey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const addDays=(k,n)=>{const [y,m,d]=k.split('-').map(Number);return dayKey(new Date(y,m-1,d+n).getTime())};
const dayDiff=(a,b)=>{const p=s=>s.split('-').map(Number);const [y1,m1,d1]=p(a),[y2,m2,d2]=p(b);return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/864e5)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const rnd=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmtClock=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,c=Math.floor(ms/10)%100;return pad2(m)+':'+pad2(s)+'.'+pad2(c)};
const fmtDur=ms=>{const s=ms/1000;if(s<60)return s.toFixed(1)+' s';const m=Math.floor(s/60);return m+' m '+(s-m*60).toFixed(1)+' s'};
const fmtMS=ms=>{const s=Math.round(ms/100)/10;const m=Math.floor(s/60);return m+':'+(s-m*60).toFixed(1).padStart(4,'0')};
const sec=ms=>(ms/1000).toFixed(1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const niceDay=k=>{const [y,m,d]=k.split('-').map(Number);return d+' '+MONTHS[m-1]};
const hhmm=t=>{const d=new Date(t);let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad2(d.getMinutes())+' '+ap};

/* ================= state ================= */
const DEF={theme:'system',vib:false,slow:6,auto:true,input:'keypad',
  setup:{add:{mode:'range',from:10,to:99,diff:'medium',tgt:'q',n:30},neev:{mode:'smart',tgt:'q',n:30}}};
const S={db:null,dl:null,sync:'local',syncMsg:'',days:LS.get('jod-days',{}),queue:LS.get('jod-queue',{items:{},cleared:0,upd:0}),
  sets:LS.get('jod-sets',{}),outbox:LS.get('jod-outbox',{}),run:null,tab:'home',settings:null,sheet:null,resultId:null};
(function(){const s=LS.get('jod-settings',{});const st=Object.assign({},DEF,s);
  st.setup={add:Object.assign({},DEF.setup.add,(s.setup||{}).add||{}),neev:Object.assign({},DEF.setup.neev,(s.setup||{}).neev||{})};S.settings=st})();
const saveSettings=()=>LS.set('jod-settings',S.settings);
function applyTheme(){const t=S.settings.theme;if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else if(S._themeSet)document.documentElement.removeAttribute('data-theme');S._themeSet=true}

/* ================= question science ================= */
// bucket: U = ikai ka jod 10 ya zyada, T = jawab 100 ya zyada
const bucket=(a,b)=>((a%10+b%10)>=10?'U':'u')+((a+b)>=100?'T':'t');
const BNAME={ut:'Seedhe (koi 10-paar nahi)',Ut:'Ikai 10-paar',uT:'100 paar',UT:'Ikai 10-paar + 100 paar'};
const BORDER=['ut','Ut','uT','UT'];
const pk=(a,b)=>Math.min(a,b)+'+'+Math.max(a,b);
const tenPaar=(a,b)=>(a%10+b%10)>=10;
// round figure (Nitesh ka tareeka): jis number ko round karne me sabse kam shift lage
function roundHint(a,b){
  const c=[];
  for(const [x,y] of [[a,b],[b,a]]){const u=x%10;if(u===0){c.push({s:0,x,y});continue}
    if(u<=5)c.push({s:u,x:x-u,y:y+u});else c.push({s:10-u,x:x+(10-u),y:y-(10-u)})}
  c.sort((p,q)=>p.s-q.s);const h=c[0];
  if(h.s===0)return a+'+'+b+' = '+(a+b);
  return a+'+'+b+' → '+Math.max(h.x,h.y)+'+'+Math.min(h.x,h.y)+' = '+(a+b);
}
function weighted(w){let s=0;for(const k in w)s+=w[k];let r=Math.random()*s;for(const k in w){r-=w[k];if(r<=0)return k}return Object.keys(w)[0]}
function bucketStats(days){ // {b:[ms,n]} over given day keys
  const out={ut:[0,0],Ut:[0,0],uT:[0,0],UT:[0,0]};
  for(const k of days){const d=S.days[k];if(!d)continue;for(const s of d.sets||[]){if(s.m!=='add'||!s.b)continue;for(const b in s.b){if(out[b]){out[b][0]+=s.b[b][0];out[b][1]+=s.b[b][1]}}}}
  return out;
}
function lastDays(n){const t=dayKey();const a=[];for(let i=n-1;i>=0;i--)a.push(addDays(t,-i));return a}
function smartWeights(){
  const st=bucketStats(lastDays(7));const enough=BORDER.every(b=>st[b][1]>=5);
  if(!enough)return {ut:.15,Ut:.25,uT:.25,UT:.35};
  const w={};let tot=0;for(const b of BORDER){const avg=st[b][0]/st[b][1]/1000;w[b]=Math.max(avg,.5)**2;tot+=w[b]}
  for(const b of BORDER)w[b]=Math.max(w[b]/tot,.08);return w;
}
function pickPair(lo,hi,want){for(let k=0;k<400;k++){const a=rnd(lo,hi),b=rnd(lo,hi);if(!want||bucket(a,b)===want)return [a,b]}return [rnd(lo,hi),rnd(lo,hi)]}
function wantFor(cfg,w){
  if(cfg.mode==='smart')return weighted(w);
  const r=Math.random();
  if(cfg.diff==='easy')return r<.5?'ut':null;
  if(cfg.diff==='hard')return r<.6?'UT':null;
  return null;
}
const NEEV_ALL=(()=>{const a=[];for(let x=1;x<=9;x++)for(let y=x;y<=9;y++)a.push([x,y]);return a})();
function neevAgg(){const agg={};for(const k in S.days){const nv=S.days[k].neev||{};for(const p in nv){const v=agg[p]||(agg[p]=[0,0,0]);v[0]+=nv[p][0];v[1]+=nv[p][1];v[2]+=nv[p][2]}}return agg}
function neevWeak(){const agg=neevAgg();return Object.entries(agg).filter(([p,v])=>v[1]>=2).map(([p,v])=>({p,avg:v[0]/v[1],wr:v[2]/v[1]})).sort((x,y)=>(y.avg*(1+2*y.wr))-(x.avg*(1+2*x.wr))).slice(0,8)}
function makeQ(run){
  const used=run._used||(run._used=new Set());const cfg=run.cfg;let a,b;
  if(run.module==='neev'){
    const weak=run._weak||(run._weak=neevWeak());
    for(let t=0;t<40;t++){const r=Math.random();let p;
      if(cfg.mode==='smart'&&r<.25&&weak.length){p=weak[rnd(0,weak.length-1)].p.split('+').map(Number)}
      else if(cfg.mode==='smart'&&r<.8){const tp=NEEV_ALL.filter(([x,y])=>x+y>=10);p=tp[rnd(0,tp.length-1)]}
      else p=NEEV_ALL[rnd(0,NEEV_ALL.length-1)];
      [a,b]=Math.random()<.5?p:[p[1],p[0]];const last=run.qs[run.qs.length-1];
      if(!(last&&pk(last.a,last.b)===pk(a,b))&&(!used.has(pk(a,b))||used.size>=40))break}
  }else{
    const lo=cfg.mode==='smart'?10:cfg.from,hi=cfg.mode==='smart'?99:cfg.to;const w=run._w||(run._w=smartWeights());
    for(let t=0;t<60;t++){[a,b]=pickPair(lo,hi,wantFor(cfg,w));if(!used.has(pk(a,b)))break}
  }
  used.add(pk(a,b));return {a,b,c:a+b};
}
function makeOptions(q,module){
  const c=q.c,o=new Set([c]);const add=d=>{if(c+d>0&&c+d!==c)o.add(c+d)};
  const U=[1,-1,2,-2,3,-3,8,-8,9,-9],T=[10,-10];const pick=a=>a[rnd(0,a.length-1)];
  if(module==='neev'){const P=[1,-1,2,-2,10,-10];let g=0;while(o.size<4&&g++<60)add(pick(P))}
  else{
    const tmpl=rnd(1,3);const u=pick(U),t=pick(T);
    if(tmpl===1){add(t);add(u)}             // dahai jaal + aakhri digit jaal
    else if(tmpl===2){add(u);add(u+t);add(t)} // do jodi: unit check se 2 kate, dahai se faisla
    else{add(u);add(u+t)}                     // unit check akela kaafi
    let g=0;while(o.size<4&&g++<80)add(pick([...U,...T,20,-20,11,-11,12,-12]));
  }
  return shuffle([...o].slice(0,4));
}
function tagOf(module,q){
  if(q.skip)return 'SKIP';if(q.ok)return null;if(module==='neev')return 'GALAT';
  const c=q.c,t=q.t;if(t==null||isNaN(t))return 'SKIP';
  if((c<100&&c>=60&&t>=10&&t<=19)||(c>=100&&t<100))return 'BHRAM';
  if(((t%10)+10)%10!==c%10)return 'UNIT';
  return 'DAHAI';
}
const TAGN={UNIT:'Aakhri digit galat',DAHAI:'Dahai galat',BHRAM:'100 ka bhram',PHISLI:'Ungli phisli',SKIP:'Skip',GALAT:'Galat'};
const TAGC={UNIT:'#e5484d',DAHAI:'#f59e0b',BHRAM:'#8b5cf6',PHISLI:'#94a3b8',SKIP:'#64748b',GALAT:'#e5484d'};
const effTag=q=>q.mt||q.tag;
const unitCatch=q=>!q.ok&&!q.skip&&q.t!=null&&((q.t%10)+10)%10!==q.c%10;
function isBench(cfg){return cfg.module==='add'&&cfg.mode==='range'&&+cfg.from===10&&+cfg.to===99&&cfg.diff==='medium'&&cfg.tgt==='q'&&+cfg.n===30}

/* ================= persistence (PHONE APP: sab phone me + Google Form -> teri Google Sheet) ================= */
const APP_VER='p1';
const FORM_DEFAULT={id:'1FAIpQLSfakfFzr-bEa3RVfxoD4Pn9rARQHwa_EebivfCw3n7B3QjYaA',entry:'348005431'};
function formCfg(){const o=LS.get('jod-form',null);if(o&&o.id&&o.entry)return o;return FORM_DEFAULT.id&&FORM_DEFAULT.entry?FORM_DEFAULT:null}
function parseFormLink(s){s=String(s||'').trim();const m=s.match(/forms\/d\/e\/([A-Za-z0-9_-]{20,})\//);const e=s.match(/entry\.(\d{4,})/);return m&&e?{id:m[1],entry:e[1]}:null}
/* IndexedDB: saare sets hamesha ke liye phone me (localStorage me sirf 21 din ke) */
const IDB={db:null,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{try{const r=indexedDB.open('jod2028',1);r.onupgradeneeded=()=>{r.result.createObjectStore('sets',{keyPath:'id'})};r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async put(v){try{const db=await this.open();await new Promise((res,rej)=>{const t=db.transaction('sets','readwrite');t.objectStore('sets').put(v);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}},
  async get(id){try{const db=await this.open();return await new Promise(res=>{const r=db.transaction('sets').objectStore('sets').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}catch(e){return null}},
  async all(){try{const db=await this.open();return await new Promise(res=>{const r=db.transaction('sets').objectStore('sets').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([])})}catch(e){return []}}};
function mirrorSets(){const since=addDays(dayKey(),-21);const keep={};for(const id in S.sets){if(S.sets[id].day>=since)keep[id]=S.sets[id]}LS.set('jod-sets',keep)}
function persist(path,data){
  const [col,id]=path.split('/');
  if(col==='days'){S.days[id]=data;LS.set('jod-days',S.days)}
  else if(col==='queue'){S.queue=data;LS.set('jod-queue',data);return}
  else if(col==='sets'){S.sets[id]=data;mirrorSets();IDB.put(data)}
  S.outbox[path]=data;LS.set('jod-outbox',S.outbox);flush();
}
let flushing=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function sendForm(cfg,p,data){
  const body=new URLSearchParams();
  body.append('entry.'+cfg.entry,JSON.stringify({v:APP_VER,p:p,at:Date.now(),d:data}));
  await fetch('https://docs.google.com/forms/d/e/'+cfg.id+'/formResponse',{method:'POST',mode:'no-cors',body:body});
}
async function flush(){
  if(flushing)return;
  const cfg=formCfg();if(!cfg){setSync('local');return}
  if(navigator.onLine===false){setSync('wait');return}
  flushing=true;
  try{for(;;){const keys=Object.keys(S.outbox);if(!keys.length){setSync('ok');break}
    const p=keys[0],data=S.outbox[p];
    if(p.indexOf('queue/')===0){delete S.outbox[p];LS.set('jod-outbox',S.outbox);continue}
    try{await sendForm(cfg,p,data)}catch(e){await sleep(800+Math.random()*900);try{await sendForm(cfg,p,data)}catch(e2){setSync('wait');break}}
    if(S.outbox[p]===data){delete S.outbox[p];LS.set('jod-outbox',S.outbox)}
    LS.set('jod-lastsent',Date.now())}}
  finally{flushing=false}
}
function setSync(s,msg){S.sync=s;S.syncMsg=msg||'';$$('.sync').forEach(el=>el.outerHTML=syncHTML())}
function syncHTML(){const n=Object.keys(S.outbox).length;
  if(!formCfg())return '<span class="sync wait"><i></i>Sheet abhi judi nahi — Settings me Form ka link daalo (data phone me safe hai)</span>';

/* ================= queue (galat + slow wapas: agle din, 3rd din, 7th din) ================= */
function updateQueue(set){
  if(set.m!=='add')return;
  const today=set.day,items=Object.assign({},S.queue.items||{});let cleared=S.queue.cleared||0;const thr=(S.settings.slow||6)*1000;
  for(const q of set.qs){const k=pk(q.a,q.b);const it=items[k];const bad=!q.ok||q.ms>=thr;
    if(bad){items[k]={a:q.a,b:q.b,stage:0,due:addDays(today,1),wr:((it&&it.wr)||0)+(q.ok?0:1),sl:((it&&it.sl)||0)+(q.ok?1:0),lastT:q.t,lastMs:q.ms,first:(it&&it.first)||today,last:today}}
    else if(it&&it.due<=today){const st=it.stage+1;if(st>=3){delete items[k];cleared++}else items[k]=Object.assign({},it,{stage:st,due:addDays(today,st===1?2:4),last:today})}}
  persist('queue/main',{items,cleared,upd:Date.now()});
}
function dueItems(){const t=dayKey();return Object.values(S.queue.items||{}).filter(i=>i.due<=t).sort((x,y)=>x.due<y.due?-1:1)}

/* ================= run (one set) ================= */
let raf=0;
const now=()=>performance.now();
function elapsed(){const r=S.run;if(!r)return 0;return r.activeMs+(r.seg!=null?now()-r.seg:0)}
function pauseRun(){const r=S.run;if(!r||r.seg==null)return;r.activeMs=elapsed();r.seg=null;saveRun()}
function resumeRun(){const r=S.run;if(!r||r.seg!=null||$('#v-practice').hidden)return;r.seg=now();tick()}
function saveRun(){const r=S.run;if(!r)return;const c=Object.assign({},r,{seg:null,activeMs:elapsed(),_used:null,_w:null,_weak:null});LS.set('jod-run',c)}
function clearRun(){S.run=null;LS.del('jod-run');cancelAnimationFrame(raf)}
function startSet(cfg){
  const today=dayKey();
  const run={id:'s'+uid(),cfg:Object.assign({},cfg),module:cfg.module,startedAt:Date.now(),day:today,
    cold:cfg.module==='add'&&cfg.mode!=='revision'&&!((S.days[today]||{}).sets||[]).some(s=>s.m==='add'),
    bench:isBench(cfg),qs:[],i:0,typed:'',activeMs:0,seg:null,qStart:0,
    limit:cfg.tgt==='q'||cfg.mode==='revision'?0:({t1:60000,t2:120000,t3:180000}[cfg.tgt]||60000),input:S.settings.input};
  if(cfg.mode==='revision'){run.qs=dueItems().slice(0,30).map(i=>({a:i.a,b:i.b,c:i.a+i.b,rev:1}));shuffle(run.qs)}
  else if(!run.limit){for(let i=0;i<cfg.n;i++)run.qs.push(makeQ(run));
    if(cfg.module==='add'&&cfg.mode==='smart'){const due=dueItems().slice(0,5);for(const d of due){const pos=rnd(0,run.qs.length-1);run.qs[pos]={a:d.a,b:d.b,c:d.a+d.b,rev:1}}}}
  else run.qs.push(makeQ(run));
  if(!run.qs.length){dialog('Aaj koi sawaal due nahi','Revision me abhi kuch baaki nahi hai. Galat ya slow sawaal agle din yahan aate hain.',[['Theek hai',null,true]]);return}
  S.run=run;openPractice();
}
function openPractice(){
  const r=S.run;show('practice');
  $('#p-title').textContent=r.module==='neev'?'Neev':r.cfg.mode==='revision'?'Revision':'Addition';
  setInput(r.input||'keypad',true);$('#p-auto').setAttribute('aria-pressed',String(!!S.settings.auto));
  r.seg=now();renderQ();updCounts();tick();
}
function curQ(){const r=S.run;return r&&r.qs[r.i]}
function renderQ(){
  const r=S.run,q=curQ();if(!q)return;
  const typed=r.typed;
  $('#p-q').innerHTML='<b>'+q.a+'</b><span class="op">+</span><b>'+q.b+'</b><span class="eq">=</span><span class="ans'+(typed?' typed':'')+'">'+(typed?esc(typed):'?')+'</span>';
  const total=r.limit?0:r.qs.length;
  $('#p-prog').style.width=(r.limit?Math.min(100,elapsed()/r.limit*100):(r.i/total*100))+'%';
  if(r.input==='opts'){if(!q.o)q.o=makeOptions(q,r.module);$('#p-opts').innerHTML=q.o.map(v=>'<button data-o="'+v+'">'+v+'</button>').join('')}
}
function updCounts(flash){const r=S.run;const ok=r.qs.filter(q=>q.done&&q.ok).length,wr=r.qs.filter(q=>q.done&&!q.ok&&!q.skip).length;
  $('#p-ok').textContent=ok;$('#p-wr').textContent=wr;
  if(flash){const st=$('#p-stats');st.classList.remove('flash-ok','flash-bad');void st.offsetWidth;st.classList.add(flash)}}
function tick(){cancelAnimationFrame(raf);const loop=()=>{const r=S.run;if(!r||r.seg==null)return;const e=elapsed();
  $('#p-clk').textContent=fmtClock(r.limit?r.limit-e:e);
  if(r.limit){$('#p-prog').style.width=Math.min(100,e/r.limit*100)+'%';if(e>=r.limit){finish(false);return}}
  raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop)}
function press(k){
  const r=S.run,q=curQ();if(!r||!q||q.done)return;
  if(k==='bk'){r.typed=r.typed.slice(0,-1)}
  else if(k==='-'){r.typed=r.typed.startsWith('-')?r.typed.slice(1):'-'+r.typed}
  else{if(r.typed.replace('-','').length>=6)return;r.typed+=k}
  renderQ();
  const digits=r.typed.replace('-','');
  if(S.settings.auto&&digits.length&&digits.length===String(q.c).length)submit(parseInt(r.typed,10),false);
}
function submit(val,viaOpt){
  const r=S.run,q=curQ();if(!r||!q||q.done||isNaN(val))return;
  const e=elapsed();q.ms=Math.max(0,Math.round(e-r.qStart));q.t=val;q.ok=val===q.c;q.done=1;q.in=viaOpt?'o':'k';q.tag=tagOf(r.module,q);
  if(!q.ok&&S.settings.vib){try{navigator.vibrate&&navigator.vibrate(70)}catch(err){}}
  updCounts(q.ok?'flash-ok':'flash-bad');next();
}
function skipQ(){const r=S.run,q=curQ();if(!r||!q||q.done)return;const e=elapsed();q.ms=Math.round(e-r.qStart);q.t=null;q.ok=false;q.skip=1;q.done=1;q.tag='SKIP';next()}
function next(){
  const r=S.run;r.i++;r.typed='';
  if(!r.limit){if(r.i>=r.qs.length){finish(false);return}}
  else{if(elapsed()>=r.limit){finish(false);return}r.qs.push(makeQ(r))}
  r.qStart=elapsed();saveRun();renderQ();
}
function setInput(mode,silent){const r=S.run;if(r)r.input=mode;S.settings.input=mode;saveSettings();
  $('#p-tkey').setAttribute('aria-pressed',String(mode!=='opts'));$('#p-topt').setAttribute('aria-pressed',String(mode==='opts'));
  $('#p-keys').hidden=mode==='opts';$('#p-opts').hidden=mode!=='opts';if(!silent)renderQ();else if(r)renderQ()}

/* ================= finish + summaries ================= */
function summarize(set){
  const qs=set.qs;const n=qs.length,ok=qs.filter(q=>q.ok).length,sk=qs.filter(q=>q.skip).length,wr=n-ok-sk;
  const tags={};for(const q of qs){const t=effTag(q);if(t)tags[t]=(tags[t]||0)+1}
  const b={};if(set.m==='add')for(const q of qs){if(q.skip)continue;const k=bucket(q.a,q.b);(b[k]||(b[k]=[0,0]))[0]+=q.ms;b[k][1]++}
  const uc=qs.filter(q=>unitCatch(q)&&effTag(q)!=='PHISLI').length;
  return {n,ok,wr,sk,ms:set.ms,avg:n?Math.round(set.ms/n):0,score:ok*2-wr*.5,max:n*2,tags,b,uc};
}
function daySum(set){const s=set.sum;return {id:set.id,at:set.startedAt,m:set.m,mode:set.cfg.mode,bench:set.bench,cold:set.cold,partial:!!set.partial,n:s.n,ok:s.ok,wr:s.wr,sk:s.sk,ms:s.ms,avg:s.avg,score:s.score,tags:s.tags,b:s.b,uc:s.uc,tgt:set.cfg.tgt}}
function finish(partial){
  const r=S.run;if(!r)return;cancelAnimationFrame(raf);
  const e=elapsed();const qs=r.qs.filter(q=>q.done).map(q=>{const o={a:q.a,b:q.b,c:q.c,t:q.t,ms:q.ms,ok:!!q.ok,tag:q.tag||null,in:q.in||'k'};if(q.skip)o.skip=1;if(q.rev)o.rev=1;if(q.o)o.o=q.o;return o});
  clearRun();
  if(!qs.length){show('home');return}
  const set={id:r.id,v:1,day:r.day,m:r.module,cfg:r.cfg,startedAt:r.startedAt,endedAt:Date.now(),cold:r.cold,bench:r.bench&&!partial,partial:!!partial,
    ms:Math.round(r.limit?Math.min(e,r.limit):e),qs};
  set.sum=summarize(set);
  persist('sets/'+set.id,set);
  const d=Object.assign({day:set.day,sets:[],neev:{}},S.days[set.day]||{});d.sets=(d.sets||[]).filter(x=>x.id!==set.id).concat([daySum(set)]);
  if(set.m==='neev'){d.neev=Object.assign({},d.neev||{});for(const q of qs){if(q.skip)continue;const k=pk(q.a,q.b);const v=(d.neev[k]||[0,0,0]).slice();v[0]+=q.ms;v[1]++;if(!q.ok)v[2]++;d.neev[k]=v}}
  d.upd=Date.now();persist('days/'+set.day,d);
  updateQueue(set);
  showResult(set.id);
}
function retag(setId,idx){
  const set=JSON.parse(JSON.stringify(S.sets[setId]));const q=set.qs[idx];if(!q||q.ok)return;
  if(q.mt==='PHISLI')delete q.mt;else q.mt='PHISLI';
  set.sum=summarize(set);persist('sets/'+setId,set);
  const d=S.days[set.day];if(d){const nd=Object.assign({},d,{sets:d.sets.map(x=>x.id===setId?daySum(set):x),upd:Date.now()});persist('days/'+set.day,nd)}
  showResult(setId,true);
}

function todaySets(m){return ((S.days[dayKey()]||{}).sets||[]).filter(s=>!m||s.m===m)}
function ringSVG(done,goal){const r=30,C=2*Math.PI*r,p=Math.min(1,done/goal);
  return '<svg class="ring" viewBox="0 0 74 74"><circle cx="37" cy="37" r="'+r+'" fill="none" stroke="var(--card2)" stroke-width="8"/><circle cx="37" cy="37" r="'+r+'" fill="none" stroke="var(--acc)" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+(C*p)+' '+C+'" transform="rotate(-90 37 37)"/><text x="37" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)" font-family="Roboto,sans-serif">'+done+'/'+goal+'</text></svg>'}
function streak(){let k=dayKey(),n=0;if(!((S.days[k]||{}).sets||[]).length)k=addDays(k,-1);while(((S.days[k]||{}).sets||[]).length){n++;k=addDays(k,-1)}return n}

    '<button class="mod" id="h-dash"><span class="mi" style="background:#16a34a">▲</span><h3>Pragati</h3><p>Target, galti ki kism, speed map, calendar.</p></button></div>';

function reviewItem(set,q,i){
  const thr=set.m==='add'?(S.settings.slow||6)*1000:2000;const t=effTag(q);
  const ic=q.ok?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>';
  let extra='';
  if(!q.ok){extra='<button class="tagbtn'+(t==='PHISLI'?' ph':'')+'" data-rt="'+i+'"><span style="width:8px;height:8px;border-radius:50%;background:'+TAGC[t]+'"></span>'+TAGN[t]+(q.skip?'':(t==='PHISLI'?' • tap: wapas':' • ungli phisli?'))+'</button>'}
  return '<div class="rv'+(q.ok?'':' bad')+'"><div class="ic">'+ic+'</div><div class="grow"><div class="q">'+q.a+'+ '+q.b+' =</div><div class="a"><span>Attempted : '+(q.skip?'—':esc(q.t))+'</span>'+(q.ok?'':'<span>Correct : '+q.c+'</span>')+'</div>'+extra+'</div><span class="t'+(q.ms>=thr?' slow':'')+'">'+sec(q.ms)+' sec</span></div>';
}
function lessonCard(set){
  const s=set.sum,qs=set.qs;const lines=[];
  if(set.m==='add'){
    const wrong=qs.filter(q=>!q.ok&&!q.skip);
    if(!wrong.length&&!s.sk)lines.push('<b>Ek bhi galti nahi.</b> '+(s.n>=30&&set.bench?'Benchmark 30/30 — ab time ghatana hai.':'Isi tarah unit check ke saath chal.'));
    else lines.push('Galtiyan: <b>'+wrong.length+'</b>'+(s.sk?' + skip '+s.sk:'')+'. Unme se <b>'+s.uc+'</b> 1-second unit check se pakdi jaati.');
    for(const q of wrong.slice(0,6)){const t=effTag(q);const u1=q.a%10,u2=q.b%10;
      if(t==='PHISLI')lines.push('<span class="m">'+q.a+'+'+q.b+'</span>: ungli phisli (tune mark kiya). Sahi '+q.c+'.');
      else if(t==='UNIT')lines.push('<span class="m">'+q.a+'+'+q.b+'</span>: tune '+q.t+'. Aakhri digit '+u1+'+'+u2+' = '+(u1+u2)+' → <b>'+q.c%10+'</b> hona tha. Check pakad leta. Round: '+roundHint(q.a,q.b));
      else if(t==='DAHAI')lines.push('<span class="m">'+q.a+'+'+q.b+'</span>: aakhri digit sahi tha, par '+q.t+' ≠ '+q.c+'. Round figure se dobara: <b>'+roundHint(q.a,q.b)+'</b>');
      else if(t==='BHRAM')lines.push('<span class="m">'+q.a+'+'+q.b+'</span> = '+q.c+(q.c<100?' (100 se kam)':' (100 se zyada)')+'. Tune '+q.t+' bheja — 100 ka bhram ya Auto Submit ne beech me bheja.');}
    const slow=qs.filter(q=>q.ok&&q.ms>=(S.settings.slow||6)*1000).sort((x,y)=>y.ms-x.ms).slice(0,3);
    if(slow.length)lines.push('Sabse slow (sahi, par '+(S.settings.slow||6)+'s+): '+slow.map(q=>'<span class="m">'+q.a+'+'+q.b+'</span> '+sec(q.ms)+'s ('+roundHint(q.a,q.b)+')').join('; ')+'. Ye kal Revision me aayenge.');
    if(set.bench){const prev=benchSets().filter(x=>x.id!==set.id&&x.at<set.startedAt).pop();
      if(prev)lines.push('Pichla benchmark: '+prev.ok+'/'+prev.n+' • '+fmtMS(prev.ms)+' → aaj: <b>'+s.ok+'/'+s.n+' • '+fmtMS(set.ms)+'</b>.');
      const st=stageOf(s.ok,s.n,set.ms);lines.push(st===0?'Target: pehle <b>30/30</b> (abhi '+s.ok+'/30).':st===1?'30/30 ✓. Agla target: <b>1:30 ke andar</b> (abhi '+fmtMS(set.ms)+').':st===2?'30/30 in 1:30 ✓. Agla target: <b>1:00</b>.':'Rocket stage ✓ — 30/30 in 1:00!')}
  }else{
    const wrong=qs.filter(q=>!q.ok&&!q.skip);
    lines.push(wrong.length?'Galat jodiyan: '+wrong.map(q=>'<span class="m">'+q.a+'+'+q.b+'='+q.c+'</span>').join(', ')+'.':'<b>Saari jodiyan sahi.</b>');
    const slow=qs.filter(q=>q.ok&&q.ms>=2000).sort((x,y)=>y.ms-x.ms).slice(0,4);
    if(slow.length)lines.push('2 second se zyada lagi: '+slow.map(q=>'<span class="m">'+q.a+'+'+q.b+'</span> '+sec(q.ms)+'s').join(', ')+'. Smart Neev inko zyada dega.');
  }
  return '<div class="tip"><h4><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M13.5 2 5 13.5h6L9.8 22l8.7-12h-6.1z"/></svg>Is set se seekh</h4><ul>'+lines.map(l=>'<li>'+l+'</li>').join('')+'</ul></div>';
}
function bucketCard(set){
  const b=set.sum.b||{};const rows=BORDER.filter(k=>b[k]&&b[k][1]);if(!rows.length)return '';
  const mx=Math.max(...rows.map(k=>b[k][0]/b[k][1]));

    rows.map(k=>{const a=b[k][0]/b[k][1];return '<span>'+BNAME[k]+'</span><span class="muted small">'+b[k][1]+' sawaal</span><b class="tnum">'+sec(a)+'s</b><div class="bw"><i style="width:'+(a/mx*100)+'%"></i></div>'}).join('')+'</div></div>';
}

function benchSets(){const out=[];for(const k of Object.keys(S.days).sort())for(const s of S.days[k].sets||[])if(s.bench)out.push(Object.assign({day:k},s));return out.sort((a,b)=>a.at-b.at)}

/* ---------- dashboard ---------- */
function lineChart(pts,o){
  const W=340,H=150,L=34,R=10,T=22,B=24;if(!pts.length)return '';
  const ys=pts.map(p=>p.y);let mn=o.min!=null?o.min:Math.min(...ys),mx=o.max!=null?o.max:Math.max(...ys);if(mx===mn){mx+=1;mn=Math.max(0,mn-1)}
  const X=i=>L+(pts.length===1?(W-L-R)/2:i*(W-L-R)/(pts.length-1)),Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  let g='';for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--bd)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+o.fmt(v)+'</text>'}
  if(o.goal!=null&&o.goal>=mn&&o.goal<=mx)g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(o.goal)+'" y2="'+Y(o.goal)+'" stroke="var(--okd)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="'+(W-R)+'" y="'+(Y(o.goal)-4)+'" text-anchor="end" style="fill:var(--okd)">'+o.goalLabel+'</text>';
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=d+' L'+X(pts.length-1).toFixed(1)+' '+(H-B)+' L'+X(0).toFixed(1)+' '+(H-B)+' Z';
  const lab=pts.map((p,i)=>(i===0||i===pts.length-1||pts.length<=6||i%Math.ceil(pts.length/5)===0)?'<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle">'+p.l+'</text>':'').join('');
  const last=pts.length-1;
  return '<div class="small" style="font-weight:700;margin:2px 0 2px">'+esc(o.aria)+'</div><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria)+'">'+g+'<path d="'+area+'" fill="'+o.color+'" opacity=".12"/><path d="'+d+'" fill="none" stroke="'+o.color+'" stroke-width="2.2" stroke-linejoin="round"/>'+pts.map((p,i)=>'<circle cx="'+X(i)+'" cy="'+Y(p.y)+'" r="'+(i===last?4.5:2.2)+'" fill="'+o.color+'"/>').join('')+'<text x="'+X(last)+'" y="'+(Y(pts[last].y)-9)+'" text-anchor="middle" style="fill:var(--ink);font-weight:700">'+o.fmt(pts[last].y)+'</text>'+lab+'</svg>';
}
function stackBars(days){
  const W=340,H=150,L=24,R=6,T=10,B=22;const keys=['UNIT','DAHAI','BHRAM','PHISLI','SKIP'];
  const tot=days.map(d=>keys.reduce((s,k)=>s+(d.t[k]||0),0));const mx=Math.max(4,...tot);const bw=(W-L-R)/days.length;
  let g='';for(let k=0;k<=2;k++){const v=Math.round(mx*k/2);const y=T+(1-v/mx)*(H-T-B);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--bd)"/><text x="'+(L-5)+'" y="'+(y+3)+'" text-anchor="end">'+v+'</text>'}
  days.forEach((d,i)=>{let y=H-B;for(const k of keys){const v=d.t[k]||0;if(!v)continue;const h=v/mx*(H-T-B);y-=h;g+='<rect x="'+(L+i*bw+bw*.18)+'" y="'+y+'" width="'+(bw*.64)+'" height="'+Math.max(h-1,1)+'" rx="2" fill="'+TAGC[k]+'"/>'}
    if(i%2===0||days.length<=7)g+='<text x="'+(L+i*bw+bw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+d.l+'</text>'});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Roz ki galtiyan kism ke hisaab se">'+g+'</svg><div class="legend">'+keys.map(k=>'<span><i style="background:'+TAGC[k]+'"></i>'+TAGN[k]+'</span>').join('')+'</div>';
}
function renderDash(){
  const t=dayKey();const bench=benchSets();const daysK=Object.keys(S.days).sort();
  let h='<div class="ttl"><div class="brand"><div class="logo" style="background:#16a34a">▲</div><div><h2>Dashboard</h2><p>Sab kuch apne aap ginaa jaata hai</p></div></div></div>';
  if(!daysK.length){h+='<div class="card empty">Abhi koi data nahi. Pehla Benchmark set karte hi yahan target, galti ki kism, speed map aur calendar bharne lagenge.</div>';$('#dash').innerHTML=h+'<div>'+syncHTML()+'</div>';return}
  // aaj
  const all=todaySets(),add=todaySets('add');const n=all.reduce((s,x)=>s+x.n,0),ok=all.reduce((s,x)=>s+x.ok,0),ms=all.reduce((s,x)=>s+x.ms,0);const cold=add.find(s=>s.cold);
  h+='<div class="sec">Aaj</div><div class="card"><div class="kpis"><div><b>'+add.length+'/3</b><span>set</span></div><div><b>'+n+'</b><span>sawaal</span></div><div><b>'+(n?(ok/n*100).toFixed(1):'0')+'%</b><span>sahi</span></div><div><b>'+(n?sec(ms/n):'0.0')+'s</b><span>avg</span></div></div>'+
    (cold?'<div class="small" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--bd)"><span class="pill wp">Thanda set</span> '+cold.ok+'/'+cold.n+' • '+fmtMS(cold.ms)+' • avg '+sec(cold.avg)+'s</div>':'')+'</div>';
  // ladder
  const daysAt=st=>new Set(bench.filter(s=>stageOf(s.ok,s.n,s.ms)>=st).map(s=>s.day)).size;
  const L=[[1,'Sahi','30/30 (Benchmark)'],[2,'Tez','30/30 + 1:30 ke andar (avg 3s)'],[3,'Rocket','30/30 + 1:00 ke andar (avg 2s)']];
  const best=bench.filter(s=>s.ok===30&&s.n===30).sort((a,b)=>a.ms-b.ms)[0];
  h+='<div class="sec">Target ki seedhi</div><div class="card ladder">'+L.map(([st,nm,ds])=>{const d=daysAt(st);return '<div class="step '+(d>=3?'done':d?'half':'')+'"><span class="n">'+(d>=3?'✓':st)+'</span><div class="grow"><b>'+nm+'</b> <span class="muted small">'+ds+'</span><div class="small muted" style="margin-top:2px">'+d+'/3 alag din'+(d>=3?' — pakka':'')+'</div></div></div>'}).join('')+
    '<div class="small muted" style="border-top:1px solid var(--bd);padding-top:10px">Pakka tab maana jayega jab 3 alag dino par ho. '+(best?'Best 30/30: <b>'+fmtMS(best.ms)+'</b> ('+niceDay(best.day)+')':'Abhi 30/30 nahi hua.')+'</div></div>';
  // benchmark trend
  const bd={};for(const s of bench){(bd[s.day]||(bd[s.day]=[])).push(s)}const bk=Object.keys(bd).sort().slice(-30);
  if(bk.length){const first=bk.map(k=>bd[k][0]);
    h+='<div class="sec">Benchmark: din ka pehla (30 din)</div><div class="card">'+lineChart(first.map((s,i)=>({l:niceDay(bk[i]),y:s.avg/1000})),{fmt:v=>v.toFixed(1)+'s',color:'var(--acc)',min:0,goal:3,goalLabel:'target 3s',aria:'Avg time / sawaal'})+
      lineChart(first.map((s,i)=>({l:niceDay(bk[i]),y:s.ok/s.n*100})),{fmt:v=>Math.round(v)+'%',color:'var(--okd)',min:Math.min(60,...first.map(s=>s.ok/s.n*100)),max:100,goal:100,goalLabel:'30/30',aria:'Accuracy'})+'</div>';}
  // galti ki kism
  const last14=lastDays(14);const td=last14.map(k=>{const tt={};for(const s of ((S.days[k]||{}).sets||[]))if(s.m==='add')for(const x in s.tags||{})tt[x]=(tt[x]||0)+s.tags[x];return {l:niceDay(k).split(' ')[0],t:tt}});
  let wrongAll=0,ucAll=0;for(const k of last14)for(const s of ((S.days[k]||{}).sets||[]))if(s.m==='add'){wrongAll+=s.wr;ucAll+=s.uc||0}
  h+='<div class="sec">Galti ki kism (14 din)</div><div class="card">'+stackBars(td)+'<div class="small" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)">14 din ki '+wrongAll+' galtiyon me se <b>'+ucAll+'</b> ('+(wrongAll?Math.round(ucAll/wrongAll*100):0)+'%) unit check se pakdi jaati. Lakshya: 0.</div></div>';
  // speed map
  const s7=bucketStats(lastDays(7)),sa=bucketStats(daysK);
  h+='<div class="sec">Speed map</div><div class="card"><table class="t"><tr><th>Kis tarah ka sawaal</th><th class="r">7 din</th><th class="r">Sab</th></tr>'+BORDER.map(b=>'<tr><td>'+BNAME[b]+'<div class="muted small">'+sa[b][1]+' sawaal</div></td><td class="r">'+(s7[b][1]?sec(s7[b][0]/s7[b][1])+'s':'—')+'</td><td class="r">'+(sa[b][1]?sec(sa[b][0]/sa[b][1])+'s':'—')+'</td></tr>').join('')+'</table><div class="small muted" style="margin-top:8px">Smart mode isi table se tay karta hai ki kaunse sawaal zyada dene hain.</div></div>';
  // neev heatmap
  const agg=neevAgg();const vals=Object.values(agg).filter(v=>v[1]).map(v=>v[0]/v[1]);
  h+='<div class="sec">Neev heatmap (1-digit jod ka avg time)</div><div class="card">';
  if(vals.length){const lo=Math.min(...vals),hi=Math.max(...vals);let g='<div class="heat"><div></div>';for(let c=1;c<=9;c++)g+='<div class="hd">'+c+'</div>';
    for(let r=1;r<=9;r++){g+='<div class="hd">'+r+'</div>';for(let c=1;c<=9;c++){const v=agg[pk(r,c)];if(!v||!v[1]){g+='<div style="background:var(--heat0)"></div>';continue}const a=v[0]/v[1];const f=hi>lo?(a-lo)/(hi-lo):0;const bad=v[2]>0;
      g+='<div title="'+r+'+'+c+': '+sec(a)+'s" style="background:color-mix(in srgb,'+(bad?'#e5484d':'#f59e0b')+' '+Math.round(15+f*70)+'%,var(--heat0));'+(r+c>=10?'outline:1.5px solid color-mix(in srgb,var(--acc) 45%,transparent);':'')+'font-size:10px">'+sec(a)+'</div>'}}
    h+=g+'</div><div class="small muted" style="margin-top:8px">Gehra = slow. Laal = kabhi galat hua. Neeli lakeer = 10-paar jodi.</div>';}
  else h+='<div class="empty">Neev ka ek set karte hi 9×9 jodiyon ka naksha banega.</div>';
  h+='</div>';
  // calendar
  const weeks=26;const end=t;let startK=addDays(end,-(weeks*7-1));const dow=(new Date(...startK.split('-').map((v,i)=>i===1?+v-1:+v)).getDay()+6)%7;startK=addDays(startK,-dow);
  let cells='';const maxQ=Math.max(30,...daysK.map(k=>(S.days[k].sets||[]).reduce((s,x)=>s+x.n,0)));
  for(let k=startK;dayDiff(k,end)>=0;k=addDays(k,1)){const q=((S.days[k]||{}).sets||[]).reduce((s,x)=>s+x.n,0);cells+='<i title="'+niceDay(k)+': '+q+' sawaal" style="'+(q?'background:color-mix(in srgb,var(--acc) '+Math.round(25+q/maxQ*75)+'%,var(--heat0))':'')+'"></i>'}
  const totalQ=daysK.reduce((s,k)=>s+(S.days[k].sets||[]).reduce((a,x)=>a+x.n,0),0);
  h+='<div class="sec">Calendar (26 hafte)</div><div class="card"><div class="calwrap"><div class="cal" style="min-width:300px">'+cells+'</div></div><div class="small muted" style="margin-top:8px">Lagataar '+streak()+' din • kul '+daysK.length+' din • '+totalQ+' sawaal</div></div>';
  // personal best
  const sets=daysK.flatMap(k=>(S.days[k].sets||[]).map(s=>Object.assign({day:k},s)));const addS=sets.filter(s=>s.m==='add'&&s.n>=20);
  const fastest=addS.filter(s=>s.ok/s.n>=.9).sort((a,b)=>a.avg-b.avg)[0];const mostDay=daysK.map(k=>({k,q:(S.days[k].sets||[]).reduce((s,x)=>s+x.n,0)})).sort((a,b)=>b.q-a.q)[0];
  h+='<div class="sec">Personal best</div><div class="card"><table class="t">'+
    '<tr><td>Best 30/30 Benchmark</td><td class="r">'+(best?fmtMS(best.ms):'—')+'</td></tr>'+
    '<tr><td>Sabse tez avg (20+ sawaal, 90%+ sahi)</td><td class="r">'+(fastest?sec(fastest.avg)+'s':'—')+'</td></tr>'+
    '<tr><td>Ek din me sabse zyada sawaal</td><td class="r">'+(mostDay?mostDay.q+' ('+niceDay(mostDay.k)+')':'—')+'</td></tr></table></div>';
  // history
  const hist=sets.sort((a,b)=>b.at-a.at).slice(0,40);
  h+='<div class="sec">Attempt History</div><div class="card list">'+hist.map(s=>setRow(s).replace('<b>','<b>'+niceDay(s.day)+' • ')).join('')+'</div>';
  h+='<div>'+syncHTML()+'</div>';
  $('#dash').innerHTML=h;bindSetRows($('#dash'));
}

/* ---------- settings ---------- */
function renderSet(){
  const st=S.settings;const seg=(g,v,l)=>'<button data-sg="'+g+'" data-v="'+v+'" aria-pressed="'+(String(st[g])===String(v))+'">'+l+'</button>';
  let h='<div class="ttl"><div class="brand"><div class="logo" style="background:#64748b">⚙</div><div><h2>Settings</h2><p>JOD 2028</p></div></div></div>';
  h+='<div class="card stack"><div class="row" style="justify-content:space-between"><b>Theme</b><div class="seg">'+seg('theme','system','Auto')+seg('theme','light','Light')+seg('theme','dark','Dark')+'</div></div>'+
    '<div class="row" style="justify-content:space-between"><div><b>Galat par vibration</b><div class="small muted">Har phone me kaam kare, zaroori nahi</div></div><div class="seg">'+seg('vib','false','Band')+seg('vib','true','Chalu')+'</div></div>'+
    '<div class="row" style="justify-content:space-between"><div><b>Slow ki seema</b><div class="small muted">Isse zyada time = Revision me wapas</div></div><div class="seg">'+seg('slow','5','5s')+seg('slow','6','6s')+seg('slow','7','7s')+'</div></div></div>';
  h+='<div class="sec">Data</div><div class="card stack"><div>'+syncHTML()+'</div><div class="small muted" style="line-height:1.5">Har set phone me save hota hai aur net hote hi apne aap teri Google Sheet me chala jaata hai. Claude wahin se padhta hai — screenshot ki zaroorat nahi, bas bol de "aaj ke set dekh le".</div>'+
    '<div class="fld"><div class="small" style="margin:0 2px 6px"><b>Google Form ka pre-filled link</b> '+(formCfg()?'<span style="color:var(--okd)">✓ juda hua</span>':'<span style="color:var(--warn)">abhi nahi juda</span>')+'</div><input id="st-form" placeholder="https://docs.google.com/forms/d/e/…/viewform?…entry.…" autocomplete="off" autocapitalize="off" spellcheck="false"></div>'+
    '<div class="r2" style="margin-top:0"><button class="btn out" id="st-fsave">Link jodo</button><button class="btn out" id="st-test">Test bhejo</button></div>'+
    '<button class="btn out full" id="st-csv">Poora data download (CSV)</button>'+
    '<div class="r2" style="margin-top:0"><button class="btn out" id="st-bak">Backup file banao</button><button class="btn out" id="st-res">Backup se wapas</button></div>'+
    '<input type="file" id="st-file" accept=".json,application/json" hidden><div class="small muted" id="st-msg"></div></div>';
  h+='<div class="sec">Niyam</div><div class="card small" style="line-height:1.55">• Pehle accuracy (30/30), phir time.<br>• Roz 3 set, pehla Benchmark.<br>• Answer ke baad 1 second: aakhri digit check.<br>• Galat/slow sawaal agle din, 3rd din, 7th din wapas.</div>';
  $('#setv').innerHTML=h;
  $('#setv').querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>{const g=b.dataset.sg;let v=b.dataset.v;if(g==='vib')v=v==='true';if(g==='slow')v=+v;st[g]=v;saveSettings();if(g==='theme')applyTheme();renderSet()});
  $('#st-csv').onclick=exportCSV;$('#st-fsave').onclick=saveFormLink;$('#st-test').onclick=testForm;$('#st-bak').onclick=backupData;$('#st-res').onclick=()=>$('#st-file').click();$('#st-file').onchange=e=>restoreData(e.target.files&&e.target.files[0]);
}
function saveFile(name,text,type){try{const b=new Blob([text],{type:type});const u=URL.createObjectURL(b);const el=document.createElement('a');el.href=u;el.download=name;document.body.appendChild(el);el.click();setTimeout(()=>{URL.revokeObjectURL(u);el.remove()},2000);return true}catch(e){return false}}
async function allSets(){const m={};for(const s of await IDB.all())m[s.id]=s;for(const id in S.sets)m[id]=m[id]||S.sets[id];return Object.values(m)}
async function exportCSV(){
  const msg=$('#st-msg');msg.textContent='Data jod raha hu…';
  const sets=await allSets();
  sets.sort((a,b)=>a.startedAt-b.startedAt);
  const rows=[['din','samay','module','mode','benchmark','thanda','a','b','sahi_jawab','tera_jawab','sahi','ms','galti']];
  for(const s of sets)for(const q of s.qs)rows.push([s.day,hhmm(s.startedAt),s.m,s.cfg.mode,s.bench?1:0,s.cold?1:0,q.a,q.b,q.c,q.t==null?'':q.t,q.ok?1:0,q.ms,effTag(q)||'']);
  const csv=rows.map(r=>r.join(',')).join('\n');
  msg.textContent=saveFile('JOD2028_data_'+dayKey()+'.csv',csv,'text/csv')?'Download ho gaya ✓ ('+sets.length+' set)':'Download nahi hua.';
}
async function backupData(){
  const msg=$('#st-msg');msg.textContent='Backup bana raha hu…';
  const b={app:'JOD2028',v:APP_VER,at:Date.now(),days:S.days,queue:S.queue,settings:S.settings,sets:await allSets()};
  msg.textContent=saveFile('JOD2028_backup_'+dayKey()+'.json',JSON.stringify(b),'application/json')?'Backup file download ho gayi ✓ ('+b.sets.length+' set). Ise sambhal ke rakh.':'Backup nahi bana.';
}
async function restoreData(file){
  const msg=$('#st-msg');if(!file)return;
  try{const b=JSON.parse(await file.text());if(!b||b.app!=='JOD2028')throw 0;
    for(const k in (b.days||{})){const v=b.days[k],loc=S.days[k];if(!loc||(v.upd||0)>(loc.upd||0))S.days[k]=v}
    if(b.queue&&(b.queue.upd||0)>(S.queue.upd||0))S.queue=b.queue;
    for(const s of (b.sets||[])){if(!s||!s.id)continue;await IDB.put(s);if(!S.sets[s.id])S.sets[s.id]=s}
    LS.set('jod-days',S.days);LS.set('jod-queue',S.queue);mirrorSets();
    msg.textContent='Backup wapas aa gaya ✓ ('+(b.sets||[]).length+' set)';renderTab();
  }catch(e){msg.textContent='Ye JOD 2028 ki backup file nahi lagti.'}
}
function saveFormLink(){
  const msg=$('#st-msg');const c=parseFormLink($('#st-form').value);
  if(!c){msg.textContent='Link sahi nahi laga. Form ka "Get pre-filled link" wala poora link daalo (usme /forms/d/e/ aur entry. dono hote hain).';return}
  LS.set('jod-form',c);renderSet();$('#st-msg').textContent='Link jud gaya ✓ Ab "Test bhejo" dabao, phir Claude ko bolo Sheet check kare.';flush();
}
async function testForm(){
  const msg=$('#st-msg');const c=formCfg();if(!c){msg.textContent='Pehle Form ka link jodo.';return}
  msg.textContent='Test bhej raha hu…';
  try{await sendForm(c,'test/'+dayKey(),{msg:'JOD 2028 test',at:Date.now()});msg.textContent='Test bhej diya ✓ Ab Claude ko bolo "Sheet check kar".'}
  catch(e){msg.textContent='Nahi gaya — internet check karo.'}
}

/* ================= events ================= */
$('#p-keys').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();press(b.dataset.k)});
$('#p-opts').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();submit(+b.dataset.o,true)});
$('#p-skip').onclick=skipQ;
$('#p-auto').onclick=()=>{S.settings.auto=!S.settings.auto;saveSettings();$('#p-auto').setAttribute('aria-pressed',String(S.settings.auto))};
$('#p-bolt').onclick=()=>{const r=S.run;if(!r||S.settings.auto||!r.typed)return;submit(parseInt(r.typed,10),false)};
$('#p-tkey').onclick=()=>setInput('keypad');$('#p-topt').onclick=()=>setInput('opts');
$('#p-back').onclick=()=>{const r=S.run;if(!r)return show('home');pauseRun();const done=r.qs.filter(q=>q.done).length;
  dialog('Set chhodna hai?',done?done+' sawaal ho chuke hain. Chhodoge to itne hi save honge (Benchmark me nahi ginenge).':'Abhi koi sawaal nahi hua. Chhodne par kuch save nahi hoga.',[['Jaari rakho',()=>{resumeRun()},false],['Chhodo',()=>{if(done)finish(true);else{clearRun();show('home')}},true]])};
document.addEventListener('keydown',e=>{if($('#v-practice').hidden||!$('#dlg-ov').hidden)return;
  if(/^[0-9]$/.test(e.key)){e.preventDefault();if(S.run&&S.run.input==='opts'){const i=+e.key-1;const q=curQ();if(q&&q.o&&q.o[i]!=null)submit(q.o[i],true)}else press(e.key)}
  else if(e.key==='Escape'){$('#p-back').click()}
  else if(e.key==='Backspace'){e.preventDefault();press('bk')}else if(e.key==='Enter'){$('#p-bolt').click()}else if(e.key==='-'){press('-')}});
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.go));
$('#sheet-ov').addEventListener('click',e=>{if(e.target.id==='sheet-ov')closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseRun();else if($('#dlg-ov').hidden)resumeRun()});
window.addEventListener('pagehide',()=>pauseRun());
window.addEventListener('storage',e=>{if(e.key==='jod-days'){S.days=LS.get('jod-days',S.days);if(!$('#v-'+S.tab).hidden)renderTab()}});

/* ================= boot ================= */
function start(data){
  applyTheme();
  if(data&&data.run&&!LS.get('jod-run',null))LS.set('jod-run',data.run);
  show('home');loadDb();
}
document.documentElement.classList.add('fs');
(function(){const m=document.querySelector('meta[name=theme-color]');const _ap=applyTheme;applyTheme=function(){_ap();try{m.content=getComputedStyle(document.documentElement).getPropertyValue('--hdr1').trim()||'#ddf1f6'}catch(e){}}})();
start({});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
</script>
